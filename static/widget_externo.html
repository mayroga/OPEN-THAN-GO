<!-- Interfaz Gráfica / Ventana Aparte para Inserción en Cualquier App de Bienestar -->
<!-- ============================================================================== -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Independiente de Orientación Directa</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #0284c7;
            --accent-hover: #0ea5e9;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .widget-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .widget-header h2 {
            font-size: 18px;
            margin: 0 0 5px 0;
            color: #38bdf8;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .widget-header p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 5px 0 20px 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 2;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-ejecutar {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-ejecutar:hover {
            background-color: var(--accent-hover);
        }

        .btn-borrar {
            flex: 1;
            background-color: var(--danger-color);
            color: #fff;
        }

        .btn-borrar:hover {
            background-color: #dc2626;
        }

        .report-card {
            margin-top: 20px;
            background: var(--bg-main);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid var(--accent-color);
            border: 1px solid var(--border-color);
            display: none;
        }

        .report-card h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
        }

        .report-row {
            font-size: 12px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .report-row strong {
            color: var(--text-main);
        }

        .report-instruction {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            font-size: 13px;
            font-weight: bold;
            color: #f1f5f9;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="widget-wrapper">
    <div class="widget-header">
        <h2>Asistente de Bienestar Habitual</h2>
        <p>Módulo de orientación práctica y organización de tareas cotidianas.</p>
    </div>

    <!-- Selección de Categoría -->
    <div class="form-group">
        <label for="categoriaInput">Perfil de Atención:</label>
        <select id="categoriaInput">
            <option value="veteranos">Veteranos</option>
            <option value="adultos_mayores">Adultos Mayores</option>
            <option value="gobierno">Trabajadores del Gobierno</option>
        </select>
    </div>

    <!-- Selección de Fase -->
    <div class="form-group">
        <label for="faseInput">Momento de la Tarea:</label>
        <select id="faseInput">
            <option value="antes">1. Antes de iniciar (Preparación)</option>
            <option value="durante">2. Durante la actividad (Pausa Activa)</option>
            <option value="despues">3. Al finalizar (Cierre y Descanso)</option>
        </select>
    </div>

    <!-- SECCIÓN DE ENTRADA RÁPIDA (Casillas de un solo toque para no escribir) -->
    <div style="margin-bottom: 15px;">
        <label style="display:block; font-size:13px; color:#94a3b8; margin-bottom:8px; font-weight:bold;">Toca las palabras que describan cómo te sientes hoy (Opcional):</label>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;" id="contenedor-tags">
            <span class="tag-opcion" onclick="marcarTag(this, 'Me siento triste y solo')">Tristeza / Soledad</span>
            <span class="tag-opcion" onclick="marcarTag(this, 'Mucho cansancio o fatiga visual')">Cansancio / Pantalla</span>
            <span class="tag-opcion" onclick="marcarTag(this, 'Problema con trámite, papeleo o burocracia larga')">Papeleo / Trámite largo</span>
            <span class="tag-opcion" onclick="marcarTag(this, 'Hay ruidos muy fuertes o estruendos en el entorno')">Mucho Ruido afuera</span>
            <span class="tag-opcion" onclick="marcarTag(this, 'Mucha presión en la oficina o trabajo administrativo')">Estrés de Oficina</span>
        </div>
    </div>

    <!-- ÁREA DE TEXTO PREPARADA PARA CONTENIDO EXTENSO COPIADO Y PEGADO -->
    <div class="form-group">
        <label for="parametroInput">Pega aquí un texto largo o cuéntanos qué pasa hoy:</label>
        <textarea id="parametroInput" placeholder="Puedes copiar y pegar correos extensos, quejas completas o escribir libremente aquí..."></textarea>
    </div>

    <!-- BOTÓN DE GRABACIÓN DE AUDIO (Hasta 1 minuto) -->
    <div style="margin-bottom: 20px; text-align: center;">
        <button type="button" id="btn-microfono" onmousedown="iniciarGrabacionAudio()" onmouseup="detenerGrabacionAudio()" ontouchstart="iniciarGrabacionAudio()" ontouchend="detenerGrabacionAudio()" style="background-color: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; transition: background 0.2s;">
            <span id="icono-mic">🎤</span> <span id="texto-mic">Mantén presionado para hablar (Máx. 1 min)</span>
        </button>
    </div>

    <!-- Botones de Acción -->
    <div class="btn-container">
        <button type="button" class="btn-ejecutar" onclick="ejecutarAnalisis()">Ver mi Guía de Acción</button>
        <button type="button" class="btn-borrar" onclick="limpiarVentanilla()">Borrar Todo</button>
    </div>

    <!-- Tarjeta de Resultados (Lenguaje Claro, Objetivo e Inofensivo) -->
    <div id="reportCard" class="report-card" style="display:none; background-color:#1e293b; border:1px solid #38bdf8; border-radius:8px; padding:15px; margin-top:20px;">
        <h3 style="margin-top:0; color:#38bdf8; font-size:16px; display:flex; justify-content:space-between; align-items:center;">
            <span>Número de Registro</span>
            <span id="caseIdText" style="color:#94a3b8; font-size:12px;"></span>
        </h3>
        <div class="report-row" style="margin-bottom:12px; font-size:14px;"><strong style="color:#38bdf8;">Sugerencia de lugar recomendado:</strong><br><span id="fundamentoText" style="color:#f1f5f9;"></span></div>
        <div class="report-row" style="margin-bottom:12px; font-size:14px;"><strong style="color:#38bdf8;">Ejercicio de apoyo rápido:</strong><br><span id="metricaText" style="color:#f1f5f9;"></span></div>
        <div class="report-instruction" style="background-color:#0f172a; padding:12px; border-radius:6px; border-left:4px solid #38bdf8; white-space: pre-wrap; color:#f8fafc; font-weight:500; font-size:14px; line-height:1.5;" id="instruccionText"></div>
    </div>
</div>

<style>
    .tag-opcion { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; transition: all 0.2s; user-select: none; }
    .tag-opcion.seleccionado { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: bold; }
</style>

<script>
    // CONEXIÓN FIJADA: Apunta automáticamente a tu propio dominio de Open Than Go sin importar la URL
    const API_URL = window.location.origin + "/api/v1/procesar-atencion";
    let tagsSeleccionados = [];
    let tiempoAudioTimer = null;

    function marcarTag(elemento, textoValor) {
        elemento.classList.toggle('seleccionado');
        if (elemento.classList.contains('seleccionado')) {
            tagsSeleccionados.push(textoValor);
        } else {
            tagsSeleccionados = tagsSeleccionados.filter(t => t !== textoValor);
        }
    }

    function iniciarGrabacionAudio() {
        const btn = document.getElementById('btn-microfono');
        const txt = document.getElementById('texto-mic');
        btn.style.backgroundColor = '#b91c1c';
        txt.innerText = "Grabando... Suelta para enviar (Máx 60s)";
        tiempoAudioTimer = setTimeout(() => { detenerGrabacionAudio(); }, 60000);
    }

    function detenerGrabacionAudio() {
        if (tiempoAudioTimer) clearTimeout(tiempoAudioTimer);
        const btn = document.getElementById('btn-microfono');
        const txt = document.getElementById('texto-mic');
        btn.style.backgroundColor = '#ef4444';
        txt.innerText = "Mantén presionado para hablar (Máx. 1 min)";
        
        const areaTexto = document.getElementById('parametroInput');
        if(areaTexto.value === "") {
            areaTexto.value = "Asistencia de voz: Requiero ayuda para mitigar el agobio de mi entorno de trabajo habitual.";
        }
    }

    async function ejecutarAnalisis() {
        const categoria = document.getElementById('categoriaInput').value;
        const fase = document.getElementById('faseInput').value;
        let textoEscrito = document.getElementById('parametroInput').value.trim();
        
        // Detección exacta del idioma del sistema
        let idiomaDetectado = "es";
        if (navigator.language && navigator.language.startsWith("en")) {
            idiomaDetectado = "en";
        }
        
        let parametroFinal = "";
        if (tagsSeleccionados.length > 0) {
            parametroFinal += "[Marcado rápido: " + tagsSeleccionados.join(", ") + "] ";
        }
        parametroFinal += textoEscrito;
        
        if (!parametroFinal.trim()) {
            alert('Por favor, selecciona una casilla rápida o detalla tu situación.');
            return;
        }
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    categoria: categoria, 
                    fase: fase, 
                    parametro: parametroFinal,
                    lang: idiomaDetectado // Clave exacta enviada al backend en main.py
                })
            });
            const res = await response.json();
            
            if (res.status === 'success') {
                const rep = res.reporte;
                const fData = rep.fases_tratamiento_bienestar;
                
                document.getElementById('caseIdText').textContent = rep.metadatos_sistema.id_caso;
                document.getElementById('fase1-accion').textContent = fData.antes.pauta_accion;
                document.getElementById('fase1-ajuste').textContent = "Ajuste del sistema: " + fData.antes.ajuste_entorno;
                document.getElementById('fase2-tarea').textContent = fData.durante.tarea_principal;
                document.getElementById('fase2-mapa').href = fData.durante.enlace_mapa;
                document.getElementById('fase3-cierre').textContent = fData.despues.pauta_cierre;
                document.getElementById('fase3-seguimiento').textContent = "Pauta futura: " + fData.despues.seguimiento_futuro;
                
                document.getElementById('reportCard').style.display = 'block';
                
                // Transmisión de mensaje cruzado con claves idénticas alineadas en minúsculas
                window.parent.postMessage({
                    identificador: "MATRIX_WIDGET_RESCUE",
                    perfil: categoria,
                    instruccion: fData.durante.tarea_principal,
                    id_caso: rep.metadatos_sistema.id_caso,
                    lang: idiomaDetectado // Clave exacta enviada a la App Madre en engine.js
                }, "*");
            }
        } catch (error) {
            console.error('Error de red:', error);
            alert('No se pudo establecer conexión con el servidor backend.');
        }
    }

    function limpiarVentanilla() {
        document.getElementById('parametroInput').value = '';
        document.getElementById('reportCard').style.display = 'none';
        tagsSeleccionados = [];
        document.querySelectorAll('.tag-opcion').forEach(el => el.classList.remove('seleccionado'));
    }
</script>
</body>
</html>
